services:
  - type: web
    name: ynp-college-attendance
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    healthCheckPath: /health
    envVars:
      # Database: use the Neon connection string (no Render database needed).
      - key: DATABASE_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: College Administrator
      - key: ADMIN_EMAIL
        sync: false
      # Email (password reset, backups) through Brevo's HTTPS API. SMTP is blocked on Render free.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        sync: false
      # Shared rate limiting (free Upstash Redis), e.g. rediss://default:PASSWORD@HOST:6379
      - key: RATELIMIT_STORAGE_URI
        sync: false
      # Automatic backup by email: secret for /cron/backup and the address that receives it.
      - key: CRON_SECRET
        sync: false
      - key: BACKUP_EMAIL
        sync: false
