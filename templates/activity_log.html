{% extends "base.html" %}{% block content %}<div class="page-head"><div><h1>Activity Log</h1><p>Track important administrator, teacher and system actions.</p></div></div><div class="panel"><form class="filter" method="get"><input name="q" value="{{q}}" placeholder="Search action, details or username"><button class="small">Search</button></form><div class="table-wrap"><table><tr><th>Date / Time</th><th>User</th><th>Action</th><th>Details</th></tr>{% for r in rows %}<tr><td>{{r.created_at}}</td><td>{{r.username}}</td><td><b>{{r.action}}</b></td><td>{{r.details}}</td></tr>{% else %}<tr><td colspan="4">No activity found.</td></tr>{% endfor %}</table></div></div>{% endblock %}
