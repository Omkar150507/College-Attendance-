{% extends "base.html" %}{% block content %}<div class="page-head"><h1>{{ title }}</h1></div><div class="panel"><form method="post"><label>Academic Year</label><select name="year" required>{% for y in years %}<option value="{{ y }}" {% if subject and subject.year==y %}selected{% endif %}>{{ y }}</option>{% endfor %}</select><label>Subject Code</label><input name="code" value="{{subject.code if subject else ''}}" required><label>Subject Name</label><input name="name" value="{{subject.name if subject else ''}}" required><label>Department</label><select name="department_id" required>{% for d in departments %}<option value="{{d.id}}" {% if subject and subject.department_id==d.id %}selected{% endif %}>{{d.name}}</option>{% endfor %}</select><br><br><button class="primary">Save Subject</button></form></div>{% endblock %}
