{% extends "base.html" %}{% block content %}<div class="page-head"><h1>{{title}}</h1></div><div class="panel"><form method="post" class="form-grid"><div><label>PRN</label><input name="prn" value="{{student.prn if student else ''}}" required></div><div><label>Name</label><input name="name" value="{{student.name if student else ''}}" required></div><div><label>Course</label><input name="course" value="{{student.course if student else 'B.Pharm'}}"></div><div><label>Year</label><select name="year" required>{% for y in year_options %}<option value="{{y}}" {% if (student.year if student else '1st Year')==y %}selected{% endif %}>{{y}}</option>{% endfor %}</select></div><div><label>Department</label><select name="department_id" required>{% for d in departments %}<option value="{{d.id}}" {% if student and student.department_id==d.id %}selected{% endif %}>{{d.name}}</option>{% endfor %}</select></div><div><button class="primary">Save</button></div></form></div>{% endblock %}
