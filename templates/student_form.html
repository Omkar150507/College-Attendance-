{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <div>
    <h1>{{ title or ('Edit Student' if student else 'Add Student') }}</h1>
    <p>Student details</p>
  </div>
  <a href="{{ url_for('students') }}" class="btn btn-secondary">Back to Students</a>
</div>

<div class="card" style="max-width: 760px; margin: 20px auto;">
  <form method="POST"
        action="{{ url_for('edit_student', student_id=student.id) if student else url_for('add_student') }}">

    <div class="form-grid">
      <div class="field">
        <label for="prn">PRN No.</label>
        <input id="prn" name="prn" type="text"
               value="{{ student.prn if student else '' }}"
               placeholder="Enter PRN number" required>
      </div>

      <div class="field">
        <label for="name">Student Name</label>
        <input id="name" name="name" type="text"
               value="{{ student.name if student else '' }}"
               placeholder="Enter student name" required>
      </div>

      <div class="field">
        <label for="course">Course</label>
        <input id="course" name="course" type="text"
               value="{{ student.course if student and student.course else 'B.Pharm' }}"
               placeholder="B.Pharm">
      </div>

      <div class="field">
        <label for="year">Year</label>
        <select id="year" name="year" required>
          <option value="">Select Year</option>
          {% for y in year_options %}
            <option value="{{ y }}" {% if student and student.year == y %}selected{% endif %}>
              {{ y }}
            </option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:24px;">
      <a href="{{ url_for('students') }}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">
        {{ 'Update Student' if student else 'Add Student' }}
      </button>
    </div>
  </form>
</div>
{% endblock %}
