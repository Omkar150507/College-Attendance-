{% extends "base.html" %}{% block content %}<div class="page-head"><div><h1>Departments</h1><p>Add, edit or remove departments and assign an HOD.</p></div></div><div class="panel"><h2>Add Department</h2><form method="post" class="form-grid"><div><label>Department Code</label><input name="code" required placeholder="PHARM"></div><div><label>Department Name</label><input name="name" required placeholder="Pharmacy"></div><div><button class="primary">Add Department</button></div></form></div><div class="panel"><h2>Department List</h2><div class="table-wrap"><table><tr><th>Code</th><th>Name</th><th>Status</th><th>Edit</th><th>Remove</th></tr>{% for d in departments %}<tr><td>{{d.code}}</td><td>{{d.name}}</td><td>{% if d.active %}Active{% else %}Inactive{% endif %}</td><td><form method="post" action="{{url_for('edit_department',department_id=d.id)}}" class="actions"><input name="code" value="{{d.code}}" required><input name="name" value="{{d.name}}" required><select name="active"><option value="1" {% if d.active %}selected{% endif %}>Active</option><option value="0" {% if not d.active %}selected{% endif %}>Inactive</option></select><button class="small primary">Save</button></form></td><td><form method="post" action="{{url_for('delete_department',department_id=d.id)}}" onsubmit="return confirm('Remove this department? It must have no students, subjects or staff.');"><button class="small danger">Delete</button></form></td></tr>{% endfor %}</table></div></div>{% endblock %}
