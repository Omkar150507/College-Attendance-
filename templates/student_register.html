<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Registration</title>
<style>body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;padding:24px}.card{max-width:560px;margin:auto;background:#fff;padding:24px;border-radius:14px;box-shadow:0 5px 20px #0001}h1{margin-top:0}label{display:block;margin:12px 0 6px;font-weight:600}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd4df;border-radius:8px}button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:8px;background:#1769aa;color:#fff;font-size:16px}.msg{padding:10px;border-radius:8px;margin-bottom:10px;background:#fff0f0}.ok{background:#effaf0}</style></head>
<body><div class="card"><h1>Student Registration</h1>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="msg {{'ok' if category=='success' else ''}}">{{message}}</div>{% endfor %}{% endwith %}
<form method="post">
<label>PRN</label><input name="prn" value="{{request.form.get('prn','')}}" required>
<label>Name</label><input name="name" value="{{request.form.get('name','')}}" required>
<label>Year</label><select name="year" required><option value="">Select Year</option>{% for y in year_options %}<option value="{{y}}" {% if selected_year==y %}selected{% endif %}>{{y}}</option>{% endfor %}</select>
<label>Batch</label><select name="batch" required><option value="">Select Batch</option>{% for b in batch_options %}<option value="{{b}}" {% if selected_batch==b %}selected{% endif %}>{{b}}</option>{% endfor %}</select>
<label>Username</label><input name="username" value="{{request.form.get('username','')}}" required>
<label>Email</label><input type="email" name="email" value="{{request.form.get('email','')}}" required>
<label>Mobile</label><input name="mobile" value="{{request.form.get('mobile','')}}" required>
<label>Security Question</label><select name="security_question" required><option value="">Select Question</option>{% for q in security_questions %}<option value="{{q}}" {% if request.form.get('security_question')==q %}selected{% endif %}>{{q}}</option>{% endfor %}</select>
<label>Security Answer</label><input name="security_answer" required>
<label>Password</label><input type="password" name="password" required>
<label>Confirm Password</label><input type="password" name="confirm_password" required>
<button type="submit">Register</button></form></div></body></html>
