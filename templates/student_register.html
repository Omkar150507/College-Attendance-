{% extends "base.html" %}{% block login_content %}<div class="login-page"><div class="login-card"><img class="login-logo" src="{{ url_for('static', filename=logo_file) }}"><h1>Student Registration</h1><p class="login-subtitle">{{ college_name }}</p><form method="post"><label>PRN Number</label><input name="prn" required><label>Full Name</label><input name="name" required><label>Department</label><select name="department_id" required>{% for d in departments %}<option value="{{d.id}}">{{d.name}}</option>{% endfor %}</select><label>Year / Class</label><select name="year" required><option value="">Select</option>{% for y in year_options %}<option value="{{y}}">{{y}}</option>{% endfor %}</select><label>Email</label><input type="email" name="email" required><label>Mobile Number</label><input name="mobile" required><label>Username</label><input name="username" required><label>Security Question</label><select name="security_question" required><option value="">Select</option>{% for q in security_questions %}<option value="{{q}}">{{q}}</option>{% endfor %}</select><label>Security Answer</label><input name="security_answer" required><label>Password</label><input type="password" name="password" required><label>Confirm Password</label><input type="password" name="confirm_password" required><button class="primary full">Create Student Account</button></form><p class="center"><a href="{{ url_for('login') }}">← Back to Login</a></p></div></div>{% endblock %}
