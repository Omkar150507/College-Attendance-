{% extends "base.html" %}{% block content %}<div class="page-head"><h1>Notifications</h1></div><div class="panel">{% for n in notifications %}<div class="info-box" style="margin-bottom:10px"><b>{{n.title}}</b><br>{{n.message}}<br><small>{{n.created_at}}</small>{% if n.link %}<br><a class="button small" href="{{url_for('read_notification',notification_id=n.id)}}">Open</a>{% endif %}</div>{% else %}<p>No notifications.</p>{% endfor %}</div>{% endblock %}
